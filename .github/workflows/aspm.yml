name: ASPM Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: SCA — Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SAST — Semgrep
        run: |
          pip install semgrep
          echo "Semgrep instalado: $(semgrep --version)"
          semgrep scan . --config=auto --sarif --output semgrep-results.sarif
          echo "Exit code: $?"
          ls -la semgrep-results.sarif && echo "✅ SARIF gerado" || echo "❌ SARIF não gerado"
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        run: ls -la semgrep-results.sarif && echo "arquivo existe" || echo "arquivo NÃO existe"

      - name: Secrets — Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          echo "Gitleaks instalado: $(./gitleaks version)"
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --no-git
          echo "Exit code: $?"
          ls -la gitleaks-results.sarif && echo "✅ SARIF gerado" || echo "❌ SARIF não gerado"
        continue-on-error: true

      - name: Debug — listar arquivos gerados
        if: always()
        run: |
          echo "=== Arquivos na raiz ==="
          ls -la
          echo "=== Arquivos .sarif ==="
          find . -name "*.sarif" 2>/dev/null || echo "Nenhum .sarif encontrado"